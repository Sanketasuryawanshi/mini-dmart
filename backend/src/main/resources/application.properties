# Server Port
server.port=${SERVER_PORT:8088}

# Database Configuration (Defaults to embedded H2 MySQL mode for zero-config cloud hosting, or connects to remote MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:minidmart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Web Console (Available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Logging
logging.level.com.dmart=INFO
logging.level.org.springframework.security=INFO
